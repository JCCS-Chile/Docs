name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "2026/**"
      - "2023/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_PATH: /Docs/2026/
      PUBLIC_REGISTRATION_SITE: ${{ vars.PUBLIC_REGISTRATION_SITE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 2026/package-lock.json

      - name: Install dependencies
        working-directory: 2026
        run: npm ci

      - name: Build 2026 site
        working-directory: 2026
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          touch _site/.nojekyll

          if [ -d 2023 ]; then
            cp -R 2023 _site/2023
          fi

          mkdir -p _site/2026
          cp -R 2026/dist/. _site/2026/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
