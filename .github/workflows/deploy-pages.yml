name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "2026/**"
      - "2023/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_PATH: /2026/
      PUBLIC_CFP_FORM_URL: ${{ vars.PUBLIC_CFP_FORM_URL }}
      PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
      PUBLIC_REGISTRATION_SITE: ${{ vars.PUBLIC_REGISTRATION_SITE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 2026/package-lock.json

      - name: Install dependencies
        working-directory: 2026
        run: npm ci

      - name: Build 2026 site
        working-directory: 2026
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          touch _site/.nojekyll
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="es">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>JCCS 2026 — 3ª Jornada Chilena de Ciberseguridad en Salud</title>
              <meta name="description" content="Gobernanza, Resiliencia e Interoperabilidad Segura en el Ecosistema Sanitario. 12 de agosto 2026 · Universidad de los Andes · Las Condes, Santiago.">
              <meta name="keywords" content="ciberseguridad,salud,Chile,JCCS,jornada,2026">
              <meta name="author" content="JCCS Chile">
              <meta name="robots" content="index, follow">
              <meta name="theme-color" content="#005A8D">
              <meta name="application-name" content="JCCS 2026">
              <link rel="canonical" href="https://www.jornadacibersalud.cl/2026/">
              <meta property="og:title" content="JCCS 2026 — 3ª Jornada Chilena de Ciberseguridad en Salud">
              <meta property="og:description" content="Gobernanza, Resiliencia e Interoperabilidad Segura en el Ecosistema Sanitario. 12 de agosto 2026 · Universidad de los Andes · Las Condes, Santiago.">
              <meta property="og:url" content="https://www.jornadacibersalud.cl/2026/">
              <meta property="og:site_name" content="JCCS 2026">
              <meta property="og:locale" content="es_CL">
              <meta property="og:type" content="website">
              <meta property="og:image" content="https://www.jornadacibersalud.cl/2026/CFP/images/header.png">
              <meta property="og:image:secure_url" content="https://www.jornadacibersalud.cl/2026/CFP/images/header.png">
              <meta property="og:image:type" content="image/png">
              <meta property="og:image:alt" content="JCCS 2026 — Jornada Chilena de Ciberseguridad en Salud">
              <meta name="twitter:card" content="summary_large_image">
              <meta name="twitter:title" content="JCCS 2026 — 3ª Jornada Chilena de Ciberseguridad en Salud">
              <meta name="twitter:description" content="Gobernanza, Resiliencia e Interoperabilidad Segura en el Ecosistema Sanitario. 12 de agosto 2026 · Universidad de los Andes · Las Condes, Santiago.">
              <meta name="twitter:image" content="https://www.jornadacibersalud.cl/2026/CFP/images/header.png">
              <meta name="twitter:image:alt" content="JCCS 2026 — Jornada Chilena de Ciberseguridad en Salud">
              <meta http-equiv="refresh" content="0; url=./2026/">
            </head>
            <body>
              <p><a href="./2026/">Ir al sitio JCCS 2026</a></p>
            </body>
          </html>
          EOF

          if [ -d 2023 ]; then
            cp -R 2023 _site/2023
          fi

          mkdir -p _site/2026
          cp -R 2026/dist/. _site/2026/
          test -n "$(find _site/2026/assets/css -type f -name '*.css' -print -quit)"
          test -f _site/2026/assets/logos/uandes-dark.png

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}2026/
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
